name: CI

# 使う分を抑えるため (private リポジトリでは macOS の 1 分は 10 分として数える):
# - PR でだけ回す。main への push では回さない (PR で通ったものしか取り込まないため)。
# - 文書だけの変更 (docs/、*.md など) では回さない。
# - PR では ubuntu だけ。macOS は週に 1 回と、手で動かしたときに回す。
on:
  pull_request:
    paths:
      - '**.go'
      - '**/testdata/**'
      - 'go.mod'
      - 'go.sum'
      - 'openspec/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  # 仕様 (openspec/) の形式を確かめる。Node は開発用の道具にだけ使う。
  # 決めた理由は docs/design/adr/0002-openspec-tooling.md。
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run spec:validate
